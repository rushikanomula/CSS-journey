<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rocket Snake</title>
  <style>
    body {
      margin: 0;
      background: #080b1a;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-bottom: 5px;
      color: #62d9ff;
    }

    p {
      margin-top: 5px;
    }

    canvas {
      background: #101735;
      border: 3px solid #62d9ff;
      box-shadow: 0 0 20px #247cff;
      max-width: 95vw;
    }
  </style>
</head>
<body>
  <h1>🚀 Rocket Snake</h1>
  <p>Use Arrow Keys or WASD | Collect 🍎 | Avoid 🪨</p>
  <canvas id="game" width="600" height="400"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const grid = 20;
    const cols = canvas.width / grid;
    const rows = canvas.height / grid;

    let snake;
    let direction;
    let nextDirection;
    let apple;
    let score;
    let gameOver;
    let gameTimer;

    const rocks = [
      { x: 5, y: 4 },
      { x: 14, y: 3 },
      { x: 23, y: 5 },
      { x: 8, y: 14 },
      { x: 18, y: 15 },
      { x: 26, y: 16 }
    ];

    function resetGame() {
      snake = [
        { x: 8, y: 10 },
        { x: 7, y: 10 },
        { x: 6, y: 10 }
      ];

      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      gameOver = false;
      placeApple();

      clearInterval(gameTimer);
      gameTimer = setInterval(update, 120);
      draw();
    }

    function placeApple() {
      do {
        apple = {
          x: Math.floor(Math.random() * cols),
          y: Math.floor(Math.random() * rows)
        };
      } while (
        snake.some(part => part.x === apple.x && part.y === apple.y) ||
        rocks.some(rock => rock.x === apple.x && rock.y === apple.y)
      );
    }

    function update() {
      if (gameOver) return;

      direction = nextDirection;

      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      const hitWall =
        head.x < 0 ||
        head.x >= cols ||
        head.y < 0 ||
        head.y >= rows;

      const hitRock = rocks.some(
        rock => rock.x === head.x && rock.y === head.y
      );

      const hitSnake = snake.some(
        part => part.x === head.x && part.y === head.y
      );

      if (hitWall || hitRock || hitSnake) {
        gameOver = true;
        clearInterval(gameTimer);
        draw();
        return;
      }

      snake.unshift(head);

      if (head.x === apple.x && head.y === apple.y) {
        score++;
        placeApple();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawStars();
      drawRocks();
      drawApple();
      drawSnake();

      ctx.fillStyle = "white";
      ctx.font = "18px Arial";
      ctx.fillText("Score: " + score, 15, 25);

      if (gameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#ff6666";
        ctx.font = "bold 40px Arial";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 15);

        ctx.fillStyle = "white";
        ctx.font = "20px Arial";
        ctx.fillText(
          "Press SPACE or ENTER to restart",
          canvas.width / 2,
          canvas.height / 2 + 30
        );

        ctx.textAlign = "left";
      }
    }

    function drawStars() {
      ctx.fillStyle = "#ffffff";

      for (let i = 0; i < 45; i++) {
        const x = (i * 83) % canvas.width;
        const y = (i * 47) % canvas.height;

        ctx.globalAlpha = 0.4 + (i % 3) * 0.2;
        ctx.fillRect(x, y, 2, 2);
      }

      ctx.globalAlpha = 1;
    }

    function drawRocks() {
      rocks.forEach(rock => {
        const x = rock.x * grid + grid / 2;
        const y = rock.y * grid + grid / 2;

        ctx.fillStyle = "#777";
        ctx.beginPath();
        ctx.arc(x, y, 9, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#aaa";
        ctx.beginPath();
        ctx.arc(x - 3, y - 3, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#444";
        ctx.beginPath();
        ctx.arc(x + 4, y + 4, 3, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawApple() {
      const x = apple.x * grid + grid / 2;
      const y = apple.y * grid + grid / 2;

      ctx.fillStyle = "#ff3b4f";
      ctx.beginPath();
      ctx.arc(x - 4, y, 6, 0, Math.PI * 2);
      ctx.arc(x + 4, y, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#45d65c";
      ctx.fillRect(x + 2, y - 10, 3, 6);
    }

    function drawSnake() {
      for (let i = snake.length - 1; i >= 1; i--) {
        const part = snake[i];

        ctx.fillStyle = i % 2 === 0 ? "#27b8e8" : "#2387d9";
        ctx.beginPath();
        ctx.arc(
          part.x * grid + grid / 2,
          part.y * grid + grid / 2,
          8,
          0,
          Math.PI * 2
        );
        ctx.fill();
      }

      drawRocket();
    }

    function drawRocket() {
      const head = snake[0];
      const x = head.x * grid + grid / 2;
      const y = head.y * grid + grid / 2;

      let angle = 0;

      if (direction.x === 1) angle = 0;
      if (direction.x === -1) angle = Math.PI;
      if (direction.y === 1) angle = Math.PI / 2;
      if (direction.y === -1) angle = -Math.PI / 2;

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);

      // Rocket flame
      ctx.fillStyle = "#ff9d24";
      ctx.beginPath();
      ctx.moveTo(-9, 0);
      ctx.lineTo(-17, -5);
      ctx.lineTo(-15, 0);
      ctx.lineTo(-17, 5);
      ctx.closePath();
      ctx.fill();

      // Rocket body
      ctx.fillStyle = "#eeeeee";
      ctx.beginPath();
      ctx.moveTo(11, 0);
      ctx.quadraticCurveTo(3, -9, -8, -7);
      ctx.lineTo(-8, 7);
      ctx.quadraticCurveTo(3, 9, 11, 0);
      ctx.fill();

      // Window
      ctx.fillStyle = "#299cff";
      ctx.beginPath();
      ctx.arc(2, -2, 3, 0, Math.PI * 2);
      ctx.fill();

      // Rocket wing
      ctx.fillStyle = "#e14d5a";
      ctx.beginPath();
      ctx.moveTo(-3, 6);
      ctx.lineTo(-8, 10);
      ctx.lineTo(2, 7);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    document.addEventListener("keydown", event => {
      const key = event.key.toLowerCase();

      if ((key === "arrowup" || key === "w") && direction.y !== 1) {
        nextDirection = { x: 0, y: -1 };
      }

      if ((key === "arrowdown" || key === "s") && direction.y !== -1) {
        nextDirection = { x: 0, y: 1 };
      }

      if ((key === "arrowleft" || key === "a") && direction.x !== 1) {
        nextDirection = { x: -1, y: 0 };
      }

      if ((key === "arrowright" || key === "d") && direction.x !== -1) {
        nextDirection = { x: 1, y: 0 };
      }

      if (gameOver && (key === " " || key === "enter")) {
        resetGame();
      }
    });

    resetGame();
  </script>
</body>
</html>
